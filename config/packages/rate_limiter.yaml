# Configuration du Rate Limiter pour l'authentification
# Documentation: https://symfony.com/doc/current/rate_limiter.html

framework:
    rate_limiter:
        # Rate limiter pour les tentatives de connexion par IP
        # Empêche les attaques par force brute depuis une même IP
        login_ip:
            policy: sliding_window
            limit: 5                    # 5 tentatives maximum
            interval: '15 minutes'      # Fenêtre de 15 minutes

        # Rate limiter pour les tentatives de connexion par compte
        # Empêche les attaques ciblant un compte spécifique
        login_account:
            policy: sliding_window
            limit: 5                    # 5 tentatives maximum
            interval: '15 minutes'      # Fenêtre de 15 minutes

        # Rate limiter pour les demandes de réinitialisation de mot de passe
        # Plus restrictif pour éviter le spam d'emails
        password_reset:
            policy: fixed_window
            limit: 3                    # 3 demandes maximum
            interval: '1 hour'          # Par heure

        # Rate limiter pour les demandes de code OTP
        otp_request:
            policy: sliding_window
            limit: 5                    # 5 demandes maximum
            interval: '15 minutes'      # Fenêtre de 15 minutes

        # Rate limiter pour la vérification OTP
        otp_verify:
            policy: sliding_window
            limit: 10                   # 10 tentatives maximum
            interval: '15 minutes'      # Fenêtre de 15 minutes

        # Rate limiter pour les demandes de magic link
        magic_link:
            policy: fixed_window
            limit: 3                    # 3 demandes maximum
            interval: '30 minutes'      # Par 30 minutes

        # Rate limiter pour les endpoints OAuth
        oauth:
            policy: sliding_window
            limit: 10                   # 10 tentatives maximum
            interval: '5 minutes'       # Fenêtre de 5 minutes

        # Rate limiter pour l'API en général (par IP)
        # Protection contre les abus généraux
        api_general:
            policy: token_bucket
            limit: 100                  # 100 tokens maximum
            rate: { interval: '1 minute', amount: 100 }

        # Rate limiter pour la création de compte
        # Empêche la création massive de comptes
        registration:
            policy: fixed_window
            limit: 5                    # 5 inscriptions maximum
            interval: '1 hour'          # Par heure par IP
